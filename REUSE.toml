version = 1

[[annotations]]
path = ["src/**", "tests/**", "scripts/**", "meson*", "identity/**", "data/*.in", "vendor/luma-platform/**", "packaging/**", ".*", ".github/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Luma contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["*.md", "docs/**", "packaging/*.md"]
precedence = "override"
SPDX-FileCopyrightText = "Luma contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["resources/**", "data/*.svg", "lumaui/fixtures/*.png"]
precedence = "override"
SPDX-FileCopyrightText = "Luma contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["resources/css/**", "resources/*.xml", "resources/*.build", "vendor/luma-platform/**/*.css", "vendor/luma-platform/**/*.py"]
precedence = "override"
SPDX-FileCopyrightText = "Luma contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["vendor/luma-platform/appkit/icons/**"]
precedence = "override"
SPDX-FileCopyrightText = "Lucide contributors"
SPDX-License-Identifier = "ISC AND MIT"

[[annotations]]
path = ["vendor/luma-platform/appkit/fonts/**"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The Newsreader Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["resources/icons/write-*-symbolic.svg"]
precedence = "override"
SPDX-FileCopyrightText = "Luma, Lucide and Feather contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0 AND ISC AND MIT"
